logging:
  file:
    path: ./build/logs   # /var/log는 CI/로컬 테스트 환경에 권한이 없어 안전한 상대경로로 대체

spring:
  scheduling:
    enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/schedule?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      port: 6379
      host: ${SPRING_DATA_REDIS_HOST:redis}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # application-oauth2.yml이 .gitignore로 CI에 존재하지 않아 registration 설정이
  # 전혀 없으면, Spring Security의 ClientRegistrationRepository 빈이 아예 생성되지
  # 않아 SecurityConfig의 oauth2Login() 설정이 NoSuchBeanDefinitionException으로 실패한다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
        provider:
          google:
            user-name-attribute: sub

# application-push.yml이 .gitignore로 CI에 존재하지 않아 webpush.* 값이 정의되지 않으면
# WebPushConfig의 @Value 주입 자체가 실패한다. 실제 발송에 쓰이지 않는 테스트 전용
# 더미 VAPID 키쌍(로컬에서 openssl로 새로 생성, 실제 서비스와 무관)이다.
webpush:
  vapid:
    public: BP9H3_anKH1ybHo_bR_gzDWoq-COlbOinTBdXUop_-9fMRLF5BE66iTkksj0vcG7Szf2PyzK2duCC-eL8wuIQSI
    private: cOod4IkRUKz64TVpIY2fxqt3-9XzOAW5uLbdlaYHFFY
  subject: mailto:test@example.com

cloud:
  aws:
    s3:
      bucket: ${BUCKET:test-bucket}
    region:
      static: ${STATIC:ap-northeast-2}
    credentials:
      access-key: ${ACCESS_KEY:test-access-key}
      secret-key: ${SECRET_KEY:test-secret-key}
    stack:
      auto: false
openai:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  secret-key: ${OPENAI_SECRET_KEY:test-openai-key}
  model: ${MODEL:gpt-4o}
  timeout:
    connect: 3000   # ms
    read: 10000     # ms
    write: 10000    # ms

resilience4j:
  circuitbreaker:
    instances:
      openAiClient:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci10ZXN0LXByb2ZpbGUtb25seS1kby1ub3QtdXNlLWluLXByb2Q=}
  access-token-validity-in-seconds: ${ACCESS_TOKEN_VALIDATING_SECONDS:43200}
  refresh-token-validity-in-seconds: ${REFRESH_TOKEN_VALIDATING_SECONDS:1209600}

slack:
  webhook-url: ${SLACK_WEB_HOOK:https://hooks.slack.com/services/test/test/test}